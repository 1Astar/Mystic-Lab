<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Mystic Lab 随心而行 — 用手势完成塔罗抽牌、小六壬掐指与梅花易数起卦" />
    <title>Mystic Lab · 随心而行</title>
    <script>
      try {
        var t = localStorage.getItem('mystic-lab-theme');
        if (t === 'moon' || t === 'star') {
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t === 'moon' ? 'light' : 'dark';
        } else {
          document.documentElement.dataset.theme = 'star';
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'star';
      }
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; }
      html[data-theme='star'], html:not([data-theme]) {
        background: #0b0b14; color: #f4f0e8;
      }
      html[data-theme='moon'] {
        background: #f6f1e8; color: #2c3340;
      }
      #app:empty::before {
        content: '加载中…';
        display: block;
        padding: 48px 24px;
        text-align: center;
        opacity: 0.45;
        font: 0.9rem/1.5 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
